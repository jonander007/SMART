<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- <link rel="stylesheet" type="text/css" href="static/custom.css"> -->
    <title>{{ title }}</title>
<!--     Custom CSS code -->
	<style>
@import url("https://fonts.googleapis.com/css2?family=Noticia+Text&display=swap");
html {
	background: linear-gradient(
			to bottom right,
			transparent 48%,
			#efefef 48%,
			#efefef 52%,
			transparent 52%
		),
		linear-gradient(
			to bottom left,
			transparent 48%,
			#efefef 48%,
			#efefef 52%,
			transparent 52%
		);
	background-size: 0.25rem 0.25rem;
}
body {
	width: 100%;
	max-width: 210mm;
	font-family: sans-serif;
	padding-bottom: 1vw;
	margin: 0 auto;
	box-shadow: 0 0 300px black;
}

h1 {
	column-span: all;
	background: black;
	color: white;
	font-size: 3vw;
	margin: 0;
	padding-left: 1rem;
}

.article-meta {
	column-span: all;
	padding-right: 1rem;
	padding-bottom: 1rem;
}
.article-meta * {
	display: inline-block;
	vertical-align: middle;
}
.article-meta svg {
	float: right;
	margin-top: -3rem;
	filter: saturate(0) contrast(5);
	border-radius: 50%;
	border: 0.5rem solid black;
	box-shadow: inset 0 0 0 2px black;
	box-sizing: border-box;
	transition: 0.75s;
}
.article-meta svg:hover {
	filter: saturate(1) contrast(1);
}
.article-meta p {
	margin: 0.25rem 0;
}
.article-meta span {
	text-decoration: underline;
	cursor: pointer;
}

h2 {
	background: black;
	color: white;
	font-size: 2rem;
	column-span: all;
	padding: 1rem;
	width: fit-content;
	max-width: 75%;
}

figure {
	width: max(50%, 350px);
	float: right;
	padding: 0 1rem;
	margin: 0;
}
img {
	width: 100%;
	filter: grayscale(1) contrast(0.75);
	transition: 0.75s;
}
img:hover {
	filter: grayscale(0) contrast(1);
}
figcaption {
	font-size: 0.75rem;
}

p {
	line-height: 1.5rem;
	padding: 0 1.5rem;
	font-family: "Noticia Text", serif;
}
/* Page-breaks when printing */
@media print {
    .page-break {
        page-break-after: always;
    }
}
/* Table Styles */
table {
/*  width: 100%;  */
  border-collapse: collapse;
  font-family: monospace;
}

table th, td {
  padding: 8px;
  text-align: center;
  background-color: white;
  border: none; /* Elimina todas las líneas de borde */
}

table thead tr:first-child {
  border-top: 2px solid black; /* Línea horizontal superior */
}

table tbody tr:last-child {
  border-bottom: 2px solid black; /* Línea horizontal inferior */
}

table tbody tr:nth-child(1) td:nth-child(n+2) { 
  border-top: 2px solid black; /* Línea horizontal entre la primera y segunda fila desde la segunda columna */
}
table, tbody, tr {
  border-left: none; /* Elimina el borde izquierdo */
  border-right: none; /* Elimina el borde derecho */
}
.pair {
    display: flex;
    flex-direction: column;
 }
.table-container, .image-container {
/*    flex: 1;  */
    margin: 10px;
}
	</style>
</head>
<body id='top'>
	<div class="page-break">
    <header>
		<div class='logo'>
			<img src="data:image/png;base64,{{ logo }}" alt="Embedded Image"/>
		</div>
		<div class='title'>
		{% block title %}
		{% endblock %}
		</div>
    </header>
	</div>

	<div class="page-break">
	<nav>
	  <ul>
		<div class="toc">
		  <li><a href="#top"><strong>Index</strong></a></li>
		  <li><a href="#general_information">General Information</a></li>
		  <li><a href="#alternatives">Alternatives</a></li>
		  <li><a href="#criteria_comparisons">Criteria Comparison</a></li>
		  <li><a href="#alternative_ratings">Alternative Ratings</a></li>
		  <li><a href="#results">Results</a></li>
		</div>
	  </ul>
	</nav>
	</div>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        {% block footer %}
        {% endblock %}	
    </footer>  
</body>
</html>
